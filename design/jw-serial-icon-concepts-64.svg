<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#071121"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#8bd8ff"/>
      <stop offset="1" stop-color="#4f9cff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .tile { fill: url(#bg); stroke: #38527a; stroke-width: 2; filter: url(#soft); }
      .label { font: 13px system-ui, Segoe UI, sans-serif; fill: #d7e3f6; text-anchor: middle; }
      .muted { stroke: #31425f; stroke-width: 1; }
      .cyan-stroke { stroke: url(#cyan); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .orange-stroke { stroke: #f28a12; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .green-stroke { stroke: #b9d629; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .white { fill: #f4f8ff; }
      .cyan-fill { fill: #8bd8ff; }
      .orange-fill { fill: #f28a12; }
      .green-fill { fill: #b9d629; }
    </style>
  </defs>

  <rect width="520" height="170" rx="16" fill="#0b1220"/>

  <!-- 1. JW Serial tecnico -->
  <g transform="translate(32 24)">
    <rect class="tile" width="64" height="64" rx="15"/>
    <text x="14" y="25" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#f4f8ff">J</text>
    <text x="29" y="25" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#f4f8ff">W</text>
    <path class="cyan-stroke" d="M10 45 C17 45 17 34 24 34 S31 56 38 45 S45 30 54 30"/>
    <circle cx="12" cy="45" r="2.5" class="cyan-fill"/>
    <circle cx="54" cy="30" r="2.5" class="orange-fill"/>
    <path class="orange-stroke" d="M47 39 L55 39"/>
    <text class="label" x="32" y="95">JW Serial</text>
  </g>

  <!-- 2. Control / nodos -->
  <g transform="translate(158 24)">
    <rect class="tile" width="64" height="64" rx="15"/>
    <path class="cyan-stroke" d="M14 43 C20 18 43 12 50 30 C57 48 32 58 18 34"/>
    <path class="green-stroke" d="M18 34 C28 30 36 35 45 24"/>
    <circle cx="14" cy="43" r="4" class="cyan-fill"/>
    <circle cx="18" cy="34" r="4" class="white"/>
    <circle cx="45" cy="24" r="4" class="cyan-fill"/>
    <circle cx="50" cy="30" r="4" class="orange-fill"/>
    <path class="orange-stroke" d="M36 45 l6 -5 l6 5"/>
    <text class="label" x="32" y="95">Control</text>
  </g>

  <!-- 3. Plotter -->
  <g transform="translate(284 24)">
    <rect class="tile" width="64" height="64" rx="15"/>
    <g opacity=".65">
      <path class="muted" d="M14 16 V52 M26 16 V52 M38 16 V52 M50 16 V52"/>
      <path class="muted" d="M12 22 H54 M12 34 H54 M12 46 H54"/>
    </g>
    <path d="M12 52 H55" stroke="#6fa9ff" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 52 V15" stroke="#6fa9ff" stroke-width="2" stroke-linecap="round"/>
    <path class="orange-stroke" d="M13 46 L22 39 L30 43 L38 27 L47 31 L55 18"/>
    <circle cx="38" cy="27" r="3" class="orange-fill"/>
    <text class="label" x="32" y="95">Plotter</text>
  </g>

  <!-- 4. Puerto serial -->
  <g transform="translate(410 24)">
    <rect class="tile" width="64" height="64" rx="15"/>
    <path class="white" d="M18 19 h28 l5 11 v8 l-5 7 H18 l-5 -7 v-8 z"/>
    <path d="M20 22 h24 l4 9 v5 l-4 6 H20 l-4 -6 v-5 z" fill="#0c1728"/>
    <circle cx="24" cy="31" r="2" class="cyan-fill"/>
    <circle cx="32" cy="31" r="2" class="cyan-fill"/>
    <circle cx="40" cy="31" r="2" class="cyan-fill"/>
    <path class="cyan-stroke" d="M18 49 C28 55 38 55 48 49"/>
    <path class="orange-stroke" d="M26 54 H39"/>
    <text class="label" x="32" y="95">Puerto</text>
  </g>
</svg>
